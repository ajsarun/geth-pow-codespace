<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Block Information</title>

    <script type="module">
        import { Web3 } from "https://cdn.jsdelivr.net/npm/web3@4.16.0/+esm";

        const web3 = new Web3(
            window.location.origin + "/rpc"
        );

        async function getBlockInfo(blockNumber) {
            try {
                const input = blockNumber.trim();

                if (input === "") {
                    throw new Error("Please enter a block number.");
                }

                const block = await web3.eth.getBlock(input);

                if (!block) {
                    throw new Error("Block not found.");
                }

                const keys = Object.keys(block);
                let str = "";

                for (let i = 0; i < keys.length; i++) {
                    const value = block[keys[i]];

                    str +=
                        "<tr>" +
                        "<td><b>" + keys[i] + "</b></td>" +
                        "<td>" + stringifyValue(value) + "</td>" +
                        "</tr>";
                }

                document.getElementById("blockinfo").innerHTML =
                    "<table border='1' cellpadding='6' cellspacing='0'>" +
                    str +
                    "</table>";
            }
            catch (error) {
                document.getElementById("blockinfo").innerHTML =
                    "Error: " + error.message;
                console.error(error);
            }
        }

        function stringifyValue(value) {
            if (typeof value === "bigint") {
                return value.toString();
            }

            if (Array.isArray(value) || typeof value === "object") {
                try {
                    return JSON.stringify(
                        value,
                        (key, val) =>
                            typeof val === "bigint"
                                ? val.toString()
                                : val
                    );
                }
                catch {
                    return String(value);
                }
            }

            return String(value);
        }

        window.getBlockInfo = getBlockInfo;
    </script>
</head>

<body>

    <h1>Block Information</h1>

    <hr>

    <label>Enter Block Number: </label>

    <input
        type="text"
        id="blocknumber"
    />

    <br><br>

    <button
        type="button"
        onclick="getBlockInfo(document.getElementById('blocknumber').value)">
        Get Block Information
    </button>

    <hr>

    <div id="blockinfo"></div>

</body>
</html>
