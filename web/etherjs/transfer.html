<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ethereum Money Transfer</title>

    <script type="module">

        import { ethers }
        from "https://cdn.jsdelivr.net/npm/ethers@6.7.0/+esm";

        let provider;
        let coinbaseAddr;

        async function getCoinbaseInfo() {

            try {

                const rpcURL =
                    window.location.origin + "/rpc";

                provider =
                    new ethers.JsonRpcProvider(rpcURL);

                coinbaseAddr =
                    await provider.send(
                        "eth_coinbase",
                        []
                    );

                document.getElementById(
                    "mainAddress"
                ).innerHTML =
                    "Address: " + coinbaseAddr;

                await getCoinbaseBalance();
            }
            catch (error) {

                document.getElementById(
                    "mainAddress"
                ).innerHTML =
                    "Error: " + error;
            }
        }


        async function getCoinbaseBalance() {

            try {

                const balance =
                    await provider.getBalance(
                        coinbaseAddr
                    );

                document.getElementById(
                    "mainBalance"
                ).innerHTML =
                    "Balance: " +
                    ethers.formatEther(balance) +
                    " ETH";
            }
            catch (error) {

                document.getElementById(
                    "mainBalance"
                ).innerHTML =
                    "Error: " + error;
            }
        }


        async function send() {

            const to =
                document.getElementById(
                    "to"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const amount =
                document.getElementById(
                    "amount"
                ).value;

            try {

                // Unlock account through Geth RPC
                await provider.send(
                    "personal_unlockAccount",
                    [
                        coinbaseAddr,
                        password,
                        60
                    ]
                );

                const signer =
                    await provider.getSigner(
                        coinbaseAddr
                    );

                const tx =
                    await signer.sendTransaction({
                        to: to,
                        value: ethers.parseEther(
                            amount
                        )
                    });

                document.getElementById(
                    "transactionHash"
                ).innerHTML =
                    "Transaction Hash: " +
                    tx.hash;

                // Wait until transaction is mined
                await tx.wait();

                await getCoinbaseBalance();
            }
            catch (error) {

                document.getElementById(
                    "transactionHash"
                ).innerHTML =
                    "Error: " + error;

                console.error(error);
            }
        }


        window.getCoinbaseInfo =
            getCoinbaseInfo;

        window.send =
            send;

    </script>
</head>


<body onload="getCoinbaseInfo();">

    <h1>Node 1</h1>

    <h1>Money Transfer</h1>

    <hr>

    <h2>Main Account Info</h2>

    <div id="mainAddress"></div>

    <br>

    <div id="mainBalance"></div>

    <hr>

    <label>
        Transfer to:
    </label>

    <input
        type="text"
        size="70"
        id="to"
    />

    <br><br>

    <label>
        Amount (ETH):
    </label>

    <input
        type="text"
        id="amount"
    />

    <br><br>

    <label>
        Passphrase:
    </label>

    <input
        type="password"
        id="password"
    />

    <br><br>

    <button
        type="button"
        onclick="send()">
        Send
    </button>

    <hr>

    <div id="transactionHash"></div>

</body>
</html>
