services:
  node1:
    image: ethereum/client-go:v1.10.26
    container_name: geth-node1

    entrypoint:
      - /bin/sh
      - /config/start.sh

    environment:
      NODE_NAME: node1

    volumes:
      - node1-data:/data
      - ./geth:/config:ro

    ports:
      - "8545:8545"
      - "8546:8546"

    networks:
      - ethereum-network

    restart: unless-stopped

  node2:
    image: ethereum/client-go:v1.10.26
    container_name: geth-node2

    entrypoint:
      - /bin/sh
      - /config/start.sh

    environment:
      NODE_NAME: node2

    volumes:
      - node2-data:/data
      - ./geth:/config:ro

    ports:
      - "9545:8545"
      - "9546:8546"

    networks:
      - ethereum-network

    restart: unless-stopped

volumes:
  node1-data:
  node2-data:

networks:
  ethereum-network:
    driver: bridge